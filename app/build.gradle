plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.mio.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.mio.launcher"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "0.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    ndkVersion '23.1.7779620'
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation project(':MioCustom')
    implementation project(':lfilepickerlibrary')
    implementation libs.bubbleseekbar
    implementation libs.constraintlayout
    implementation libs.library
    implementation libs.gson
    implementation libs.filedownloader
    implementation libs.okhttp
    implementation libs.cardview
    implementation libs.material
    implementation libs.appcompat
    implementation libs.gifdrawable
    implementation libs.customactivityoncrash
    implementation libs.zip4j
    implementation libs.commonsio
    implementation libs.curseapi
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}